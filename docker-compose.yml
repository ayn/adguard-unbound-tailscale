services:
  adguardhome:
    image: ${AGH_IMAGE}
    container_name: ${AGH_CONTAINER_NAME}
    restart: unless-stopped

    # No host port mappings are used.  AdGuard Home binds DNS and its plain
    # web UI on the macvlan LAN address and on the private internal bridge.
    # Tailnet HTTPS for the web UI terminates at Caddy below.
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf

    networks:
      adguard_lan:
        # Keep the existing macvlan LAN address and default route behavior.
        ipv4_address: ${AGH_IPV4}
        gw_priority: 100
      adguard_internal:
        # Private-by-convention Docker bridge used only for AGH -> Unbound.
        # Do not set Docker's internal:true here: recursive Unbound needs
        # outbound Internet access to query root and authoritative servers.
        ipv4_address: ${INTERNAL_AGH_IPV4}

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: adguardhome-caddy
    restart: unless-stopped
    depends_on:
      adguardhome:
        condition: service_started
    networks:
      - adguard_internal
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - DOMAIN=${DOMAIN}
      - CF_API_TOKEN=${CF_API_TOKEN}

  tailscale:
    image: ${TAILSCALE_IMAGE}
    container_name: ${TAILSCALE_CONTAINER_NAME}
    restart: unless-stopped

    # Share Caddy's network namespace so this Tailscale node exposes Caddy's
    # :443 (HTTPS via Let's Encrypt + Cloudflare DNS-01) and :80 (auto HTTPS
    # redirect) directly on the tailnet. AdGuard Home's web UI is no longer
    # tailnet-reachable directly; Caddy is the only front door.
    network_mode: service:caddy
    depends_on:
      caddy:
        # When caddy is explicitly restarted via docker compose, restart this
        # sidecar too so it rejoins the current shared network namespace.
        condition: service_started
        restart: true

    # Tailscale needs a TUN device for kernel networking.  State is persisted so
    # the non-ephemeral auth key is only needed for the first successful login.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./tailscale-state:/var/lib/tailscale
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_ACCEPT_DNS: "false"
      TS_HOSTNAME: ${TS_HOSTNAME}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      # Do NOT set TS_SERVE_CONFIG. Caddy is the TLS terminator on this
      # tailnet IP; tailscale serve would intercept :443 first with its
      # *.ts.net cert and break SNI for ${DOMAIN}. If migrating from a
      # setup that used `tailscale serve`, clear leftover state once:
      #   docker exec adguardhome-tailscale tailscale serve reset
      # State persists in ./tailscale-state, so this is a one-time fix.

  unbound:
    image: ${UNBOUND_IMAGE}
    container_name: ${UNBOUND_CONTAINER_NAME}
    restart: unless-stopped

    # This resolver is intentionally private: it joins only adguard_internal,
    # publishes no host ports, and is not reachable from the LAN.  AGH reaches
    # it at a static bridge IP so AGH does not depend on Docker DNS for its
    # upstream resolver.
    networks:
      adguard_internal:
        ipv4_address: ${INTERNAL_UNBOUND_IPV4}

    volumes:
      - ./unbound/custom.conf.d:/etc/unbound/custom.conf.d:ro
      - ./unbound/var:/var/unbound

volumes:
  caddy-data:
  caddy-config:

networks:
  adguard_internal:
    name: adguard_internal
    driver: bridge
    ipam:
      config:
        - subnet: ${INTERNAL_SUBNET}

  adguard_lan:
    name: adguard_lan
    driver: macvlan
    driver_opts:
      # The parent interface is the Pi's physical LAN interface.
      parent: ${LAN_PARENT_IFACE}
    ipam:
      config:
        - subnet: ${LAN_SUBNET}
          gateway: ${LAN_GATEWAY}

          # This stack assigns AGH_IPV4 directly to the container above.
          # It does not reserve the address in UniFi DHCP; reserve it there
          # if this test becomes permanent.
